        AethylFlyingLow = what
        AethylFlyingHigh = what
        AethylInSpaceLow = what
        AethylInSpaceHigh = what
            
        LooneSrfLanded =  what
        LooneSrfSplashedPoles = You look out the window. Even from inside, you can feel the pressure. 
        LooneSrfSplashedEquator = You look out the window. Even from inside, you can feel the pressure.
        LooneSrfSplashedShatteredSea =You look out the window. Even from inside, you can feel the pressure.
        LooneSrfSplashedMidsea =You look out the window. Even from inside, you can feel the pressure.
        LooneSrfLandedPoles = what
        LooneSrfLandedEquator = what
        LooneSrfLandedShatteredSea = what
        LooneSrfLandedMidsea = what
        LooneFlyingLow = The air here seems as soupy as water. You know that the air outside is breathable, yet you don’t want to try.
        LooneFlyingHigh = Wispy clouds of remaining algae zoom past your window as you speed through the high atmosphere of Loone. You remember that the area near the seas is breathable due to algae and Krackensteinian terraforming efforts.
        LooneInSpaceLow =You look into the massive raging storms of Loone. During the wars, you have been told, ships of bioweapons crashed into it, attempting to destroy the Krackenstein bases. They have only hastened the inevitable.
        //LooneInSpaceLowPoles =  
        //LooneInSpaceLowEquator = 
        //LooneInSpaceLowMidsea = 
        //LooneInSpaceLowShatteredSea = 
        LooneInSpaceHigh = You peer out the window to survey the green-brown marble below you. You weep for this great one’s fall from glory.
            
        SunSrfLanded = what
        SunInSpaceLow = what
        SunInSpaceHigh =what
    }
}
