@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    AethylSrfLandedLaunchPad = Wow. You probably haven't gone anywhere. Science farming loser
    AethylSrfLandedRunway = I doubt you left the runway
    AethylSrfLandedVAB = You didn't blow it up! How are you going to get down?
    AethylSrfLandedSPH = How'd you get up there?
    AethylSrfLanded = You observe the ground. Yep. That's volcanic rock.
    //AethylSrfLanded = for new biomes
    //AethylSrfLanded = 
    //AethylSrfLanded = 
    AethylFlyingLow = Wow, we're flying! Look at those clouds!
    AethylFlyingHigh = You look out the window, we look so small...
    AethylInSpaceLow = So many forces at action... and so many lives at the mercy of chance
    AethylInSpaceHigh = You observe the blue marble floating alongside you, and the thin veil of the atmosphere that keeps all of kerbal life alive. You think you can spot the space center, and ask mission control if its visible.
        
    LooneSrfLanded =  You swear and look out the window. You survived the hell dive down to the surface. You feel a sigh of relief and the gentle pop of a huge bubble underneath. 
    LooneSrfSplashedPoles = Even at the poles of this grand planet, it is still around 300 Kelvin. You are glad you’re not on Apollyon.
    LooneSrfSplashedEquator = The pressure of the atmosphere weighing down on you seems to be massive, even though you know that it is safe to remove your helmet. The algae drifts lazily through the sea beside you.
    LooneSrfSplashedShatteredSea = You ask mission control if you can get back into the ship. The reply - “No.”
    LooneSrfSplashedMidsea = You scan the horizon for any old Krackenstein ships. They fished here before the war to feed their population
    LooneSrfLandedPoles = what
    LooneSrfLandedEquator = what
    LooneSrfLandedShatteredSea = what
    LooneSrfLandedMidsea = what
    LooneFlyingLow = You observe the horizon, you feel the weight of the atmosphere above you, feeling sad for this pitiful planet. You should get back in...
    LooneFlyingHigh = You hope to all there is out there that you survive this.
    LooneInSpaceLowPoles = Loone's Poles have some of the most striking aurorae in the system. You hope to see them one day. In this land of giants and storms, it will just take a small amount of time before leviathan wakes.
    LooneInSpaceLowEquator = The vastness of this gargantuan planet frightens you to the depths of your kerbal heart. The only thing that could damage this is the rise of Lucifer. You feel pity for the dying world, and the fall of the Leviathan.
    LooneInSpaceLowMidsea = The midsea of Loone is one of the most turbulent seas in the universe. Under the clouds, you feel as though you might be able to see the hundred-meter waves of the Midsea.
    LooneInSpaceLowShatteredSea = The great spot of Loone hosts a sea shattered over eons by storms and hurricanes. You strain your eyes to gaze into the green-brown skies of a dying world.
    LooneInSpaceHigh = The speckled green and brown of this dying world makes you incredibly melancholy. This dying biosphere has no way to escape the expansion of Lucifer’s fury, and you wonder if intelligence may have one day emerged. The vast gulfs of space between you and the only hope for kerbalkind becomes readily apparent. Is it worth it for this to exist for only a brief moment in time, or would it be better had it never existed at all?
        
    SunSrfLanded = What did you just do??? 
    SunInSpaceLow = This is way too hot. Who okayed me to go outside like Icarus? Is this metal? HOT HOT HOT
    SunInSpaceHigh = You gaze upon the great titan that was once a peaceful and warm star. This giant would never notice if your entire world disappeared, yet you feel pity for it. It is dying, and giving one last push before the leviathan falls.
}
