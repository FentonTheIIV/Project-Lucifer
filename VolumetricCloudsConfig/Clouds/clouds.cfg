				lightMarchSteps = 4
				lightMarchDistance = 1200
				baseStepSize = 75
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 1500
			}
			noise                                                               //noise applied to the volumetric clouds. makes for shape variation. You can change this ingame
			{
				erosionDepth = 0.65
				worley
				{
					spherical = 1
					persistence = 0.57
				}
			}
			coverageMap
			{
				value = StockVolumetricClouds/Clouds/Textures/PluginData/Kerbin/base/coverage  // Coverage, is like a heightmap but for clouds. Bright white is lots of clouds, black is none. You can draw this ingame if you want but it's not fun
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			cloudTypeMap                                                                                                                                    //cloud type map. Tells the game which type of cloud is found where. can also be drawn in game
			{
				value = StockVolumetricClouds/Clouds/Textures/PluginData/Kerbin/base/type
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			ambientSound
