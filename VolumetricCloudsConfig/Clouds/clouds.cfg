EVE_CLOUDS                                                                      // theres an ingame editing menu btw, try that out.
{
	OBJECT
	{
		name = Aethyl-Base-Layer                                             // Layer name
		body = Aethyl                                         // celestial body name.
		altitude = 1200                                            //cloud layer altitude
		detailSpeed = 0,6,0                                                 // speed at which the detail texture gets moved.
		speed = 0,22.89040185984723,0                           // speed at which the clouds move
		speedMode = LinearSurface
		settings
		{
			_DetailTex = StockVolumetricClouds/Clouds/Textures/PluginData/detail1                           // leave this alone. Too much effort for not much difference
			_DetailScale = 30                                                                                                                     // scale of the detail tex. Play around with it and see what you like.
			_UVNoiseTex = StockVolumetricClouds/Clouds/Textures/PluginData/uvnoise1                 // leave this alone. Too much effort for not much difference
			_UVNoiseStrength = 0.00020000001                                                                                    // scale of the detail tex. Play around with it and see what you like.
			_BumpScale = 0.5                                                                                                                    // Scale of the normals
			_Lambertian = 0.75                                                                                                                   // wiki has a nice graphic on this. mess around with it
			_Color = 512,512,512,255                                                                                                        // Color of clouds
			_MainTex
			{
				value = StockVolumetricClouds/Clouds/Textures/PluginData/Kerbin/base/scaled             // scaled texture. Take the coverage and Color to alpha> black it. Get rid of all the black.
				isClamped = True
			}
			_BumpMap
			{
				value = StockVolumetricClouds/Clouds/Textures/PluginData/Kerbin/base/normals            // normals
				isClamped = True
			}
			_FlowMap
			{ 
                //value =                                                   // flow map if you've got one. get rid of the comments btw if you're using this
				//isClamped = True
			}
			cloudColorMap
			{
				value = mymod/volumetricconfig/cloudColorMap				//cloud color map. for different cloud colors across the planet. Make it white if you want
			}
		}
		layer2D                                                                             // ignore this
		{
			shadowMaterial
			{
				_ShadowFactor = 1
				_VolumetricShadowDensity
				{
				}
			}
			macroCloudMaterial
			{
				_DetailDist = 2E-06
			}
		}
